<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 540" role="img" aria-labelledby="title desc">
  <title id="title">CBS3D++</title>
  <desc id="desc">A finite-element-based fluid dynamics solver for multiphysics and scalable parallel computing.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#eef3f7"/>
      <stop offset="1" stop-color="#e4ebf1"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#078eb6"/>
      <stop offset="1" stop-color="#16b7cf"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0a2540" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1800" height="540" rx="28" fill="url(#background)"/>

  <g transform="translate(95 76)" filter="url(#soft-shadow)">
    <g fill="none" stroke="#0a2540" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M72 326 L176 36 L356 302 Z"/>
      <path d="M72 326 L198 176 L356 302"/>
      <path d="M176 36 L198 176"/>
      <path d="M198 176 L356 302"/>
    </g>
    <g fill="#0a2540">
      <circle cx="72" cy="326" r="15"/>
      <circle cx="176" cy="36" r="15"/>
      <circle cx="356" cy="302" r="15"/>
      <circle cx="198" cy="176" r="12"/>
    </g>
    <path d="M-10 252 C80 300 145 280 216 232 C278 190 330 190 410 216"
          fill="none" stroke="#f8fafc" stroke-width="38" stroke-linecap="round"/>
    <path d="M-10 252 C80 300 145 280 216 232 C278 190 330 190 410 216"
          fill="none" stroke="url(#flow)" stroke-width="21" stroke-linecap="round"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="570" y="230" font-size="154" font-weight="500" letter-spacing="-6" fill="#0a2540">CBS3D</text>
    <text x="1215" y="230" font-size="132" font-weight="400" letter-spacing="4" fill="#10aeca">++</text>

    <text x="578" y="323" font-size="45" font-weight="400" letter-spacing="0.4" fill="#17324d">
      A Finite Element based Fluid Dynamics Solver
    </text>

    <text x="580" y="398" font-size="35" font-weight="300" letter-spacing="1.2" fill="#66798a">
      Multiphysics
    </text>
    <circle cx="825" cy="387" r="6" fill="#10aeca"/>
    <text x="850" y="398" font-size="35" font-weight="300" letter-spacing="1.2" fill="#66798a">
      Highly Scalable Parallel Solver
    </text>
  </g>
</svg>

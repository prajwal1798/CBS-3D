name: LTS MPI/PETSc audit

on:
  push:
    branches:
      - integration/sa-mpi
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  topology-serial-verification:
    name: Serial topology and wall-coupling verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Compile topology regression with sanitizers
        run: |
          g++ -std=c++20 -O1 -g \
            -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined \
            -fno-omit-frame-pointer \
            -Iinclude \
            tests/TurbulenceWallTopologyVerification.cpp \
            src/turbulence/WallDistance.cpp \
            -o turbulence_wall_topology_verification

      - name: Run topology regression
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./turbulence_wall_topology_verification

      - name: Compile wall-law algebra with sanitizers
        run: |
          for test in WallTreatmentVerification WallTreatmentReynoldsSweep WallTreatmentNASAReference; do
            g++ -std=c++20 -O1 -g \
              -Wall -Wextra -Werror -pedantic \
              -fsanitize=address,undefined \
              -fno-omit-frame-pointer \
              -Iinclude \
              "tests/${test}.cpp" \
              src/turbulence/WallTreatment.cpp \
              -o "$test"
          done

      - name: Run wall-law algebra
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ./WallTreatmentVerification
          ./WallTreatmentReynoldsSweep
          ./WallTreatmentNASAReference

      - name: Compile production wall-coupling regression
        run: |
          g++ -std=c++20 -O1 -g \
            -Wall -Wextra -Werror -Wno-error=unused-function -pedantic \
            -fsanitize=address,undefined \
            -fno-omit-frame-pointer \
            -Iinclude \
            tests/WallModelCouplingVerification.cpp \
            src/turbulence/WallModelCoupling.cpp \
            src/turbulence/WallTreatment.cpp \
            -o WallModelCouplingVerification

      - name: Run production wall-coupling regression
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          CBS3D_SA_WALL_TREATMENT: "1"
        run: ./WallModelCouplingVerification

      - name: Configure existing serial regression suite
        run: |
          cmake -S . -B build-serial \
            -DCMAKE_BUILD_TYPE=Release \
            -DCBS3D_ENABLE_OPENMP=ON \
            -DCBS3D_ENABLE_MPI=OFF \
            -DCBS3D_ENABLE_PETSC=OFF \
            -DCBS3D_BUILD_TESTS=ON \
            -DCBS3D_BUILD_SOURCE_VALIDATION=ON

      - name: Build existing serial solver and tests
        run: cmake --build build-serial --parallel 2

      - name: Generate miniature flat-plate wall-model case
        run: |
          python3 examples/Flat_Plate_Turbulent/generate_case.py \
            --output-prefix /tmp/cbs_flat_plate_smoke \
            --target-yplus 1 \
            --nx-upstream 2 \
            --nx-plate 4 \
            --ny 6 \
            --nz 1 \
            --iterations 3
          test -s /tmp/cbs_flat_plate_smoke.plt
          test -s /tmp/cbs_flat_plate_smoke.bco
          test -s /tmp/cbs_flat_plate_smoke.par

      - name: Run end-to-end flat-plate wall-model smoke case
        env:
          CBS3D_SA_WALL_TREATMENT: "1"
          OMP_NUM_THREADS: "1"
        run: |
          ./build-serial/cbs3dpp_si /tmp/cbs_flat_plate_smoke | tee /tmp/flat_plate_smoke.log
          grep -q "SA production wall treatment: ON" /tmp/flat_plate_smoke.log

      - name: Run existing CTest suite
        run: ctest --test-dir build-serial --output-on-failure

      - name: Publish serial topology/wall status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=success
          if [ "$JOB_STATUS" != "success" ]; then state=failure; fi
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"topology-wall/serial\",\"description\":\"Topology + wall coupling + flat-plate smoke + serial regressions\",\"target_url\":\"$target_url\"}"

  mpi-petsc-build:
    name: MPI/PETSc build and cross-rank topology/wall verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Install MPI and PETSc
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            openmpi-bin \
            libopenmpi-dev \
            libpetsc-real-dev \
            pkg-config

      - name: Resolve PETSc prefix
        shell: bash
        run: |
          set -euo pipefail
          if pkg-config --exists PETSc; then
            PETSC_PREFIX="$(pkg-config --variable=prefix PETSc)"
          elif pkg-config --exists petsc; then
            PETSC_PREFIX="$(pkg-config --variable=prefix petsc)"
          else
            echo "PETSc pkg-config metadata not found" >&2
            exit 1
          fi
          test -f "$PETSC_PREFIX/include/petsc.h"
          test -d "$PETSC_PREFIX/lib"
          echo "PETSC_DIR=$PETSC_PREFIX" >> "$GITHUB_ENV"
          echo "PETSc prefix: $PETSC_PREFIX"

      - name: Configure distributed solver
        run: |
          cmake -S . -B build-mpi-petsc \
            -DCMAKE_BUILD_TYPE=Release \
            -DCBS3D_ENABLE_MPI=ON \
            -DCBS3D_ENABLE_PETSC=ON \
            -DCBS3D_ENABLE_OPENMP=ON \
            -DCBS3D_BUILD_TESTS=OFF \
            -DCBS3D_BUILD_SOURCE_VALIDATION=OFF

      - name: Build distributed solver
        run: cmake --build build-mpi-petsc --parallel 2

      - name: Verify executable
        run: test -x build-mpi-petsc/cbs3dpp_si

      - name: Compile two-rank topology regression
        run: |
          mpic++ -std=c++20 -O2 \
            -Wall -Wextra -Werror -pedantic \
            -DOMPI_SKIP_MPICXX=1 \
            -DMPICH_SKIP_MPICXX=1 \
            -DCBS3D_USE_MPI=1 \
            -Iinclude \
            tests/TurbulenceWallTopologyMPIVerification.cpp \
            src/turbulence/WallDistance.cpp \
            -o turbulence_wall_topology_mpi_verification

      - name: Run two-rank topology regression
        run: mpirun -np 2 ./turbulence_wall_topology_mpi_verification

      - name: Compile two-rank wall-model rank-local regression
        run: |
          mpic++ -std=c++20 -O2 \
            -Wall -Wextra -Werror -Wno-error=unused-function -pedantic \
            -DOMPI_SKIP_MPICXX=1 \
            -DMPICH_SKIP_MPICXX=1 \
            -DCBS3D_USE_MPI=1 \
            -Iinclude \
            tests/WallModelCouplingMPIRankLocalVerification.cpp \
            src/turbulence/WallModelCoupling.cpp \
            src/turbulence/WallTreatment.cpp \
            src/parallel/HaloExchange.cpp \
            -o wall_model_mpi_rank_local_verification

      - name: Run two-rank wall-model rank-local regression
        env:
          CBS3D_SA_WALL_TREATMENT: "1"
        run: mpirun -np 2 ./wall_model_mpi_rank_local_verification

      - name: Publish MPI topology/wall status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=success
          if [ "$JOB_STATUS" != "success" ]; then state=failure; fi
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"topology/mpi-petsc\",\"description\":\"MPI/PETSc build + topology + wall rank-local\",\"target_url\":\"$target_url\"}"

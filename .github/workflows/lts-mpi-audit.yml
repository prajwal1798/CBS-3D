name: LTS MPI/PETSc audit

on:
  push:
    branches:
      - integration/sa-mpi
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  topology-serial-verification:
    name: Serial topology and wall-coupling verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Compile topology regression with sanitizers
        run: |
          g++ -std=c++20 -O1 -g \
            -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined \
            -fno-omit-frame-pointer \
            -Iinclude \
            tests/TurbulenceWallTopologyVerification.cpp \
            src/turbulence/WallDistance.cpp \
            -o turbulence_wall_topology_verification

      - name: Run topology regression
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./turbulence_wall_topology_verification

      - name: Compile wall-law algebra with sanitizers
        run: |
          for test in WallTreatmentVerification WallTreatmentReynoldsSweep WallTreatmentNASAReference; do
            g++ -std=c++20 -O1 -g \
              -Wall -Wextra -Werror -pedantic \
              -fsanitize=address,undefined \
              -fno-omit-frame-pointer \
              -Iinclude \
              "tests/${test}.cpp" \
              src/turbulence/WallTreatment.cpp \
              -o "$test"
          done

      - name: Run wall-law algebra
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ./WallTreatmentVerification
          ./WallTreatmentReynoldsSweep
          ./WallTreatmentNASAReference

      - name: Compile production wall-coupling regression
        run: |
          g++ -std=c++20 -O1 -g \
            -Wall -Wextra -Werror -Wno-error=unused-function -pedantic \
            -fsanitize=address,undefined \
            -fno-omit-frame-pointer \
            -Iinclude \
            tests/WallModelCouplingVerification.cpp \
            src/turbulence/WallModelCoupling.cpp \
            src/turbulence/WallTreatment.cpp \
            -o WallModelCouplingVerification

      - name: Run production wall-coupling regression
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          CBS3D_SA_WALL_TREATMENT: "1"
        run: ./WallModelCouplingVerification

      - name: Configure existing serial regression suite
        run: |
          cmake -S . -B build-serial \
            -DCMAKE_BUILD_TYPE=Release \
            -DCBS3D_ENABLE_OPENMP=ON \
            -DCBS3D_ENABLE_MPI=OFF \
            -DCBS3D_ENABLE_PETSC=OFF \
            -DCBS3D_BUILD_TESTS=ON \
            -DCBS3D_BUILD_SOURCE_VALIDATION=ON

      - name: Build existing serial solver and tests
        run: cmake --build build-serial --parallel 2

      - name: Generate miniature flat-plate wall-model case
        run: |
          python3 examples/Flat_Plate_Turbulent/generate_case.py \
            --output-prefix /tmp/cbs_flat_plate_smoke \
            --target-yplus 1 \
            --nx-upstream 2 \
            --nx-plate 4 \
            --ny 6 \
            --nz 1 \
            --iterations 3
          test -s /tmp/cbs_flat_plate_smoke.plt
          test -s /tmp/cbs_flat_plate_smoke.bco
          test -s /tmp/cbs_flat_plate_smoke.par

      - name: Run end-to-end flat-plate wall-model smoke case
        env:
          CBS3D_SA_WALL_TREATMENT: "1"
          OMP_NUM_THREADS: "1"
        run: |
          ./build-serial/cbs3dpp_si /tmp/cbs_flat_plate_smoke | tee /tmp/flat_plate_smoke.log
          grep -q "SA production wall treatment: ON" /tmp/flat_plate_smoke.log

      - name: Run existing CTest suite
        run: ctest --test-dir build-serial --output-on-failure

      - name: Publish serial topology/wall status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=success
          if [ "$JOB_STATUS" != "success" ]; then state=failure; fi
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"topology-wall/serial\",\"description\":\"Topology + wall coupling + flat-plate smoke + serial regressions\",\"target_url\":\"$target_url\"}"

  mpi-petsc-build:
    name: MPI/PETSc build and cross-rank topology verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Install MPI and PETSc
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            openmpi-bin \
            libopenmpi-dev \
            libpetsc-real-dev \
            pkg-config

      - name: Resolve PETSc prefix
        shell: bash
        run: |
          set -euo pipefail
          if pkg-config --exists PETSc; then
            PETSC_PREFIX="$(pkg-config --variable=prefix PETSc)"
          elif pkg-config --exists petsc; then
            PETSC_PREFIX="$(pkg-config --variable=prefix petsc)"
          else
            echo "PETSc pkg-config metadata not found" >&2
            exit 1
          fi
          test -f "$PETSC_PREFIX/include/petsc.h"
          test -d "$PETSC_PREFIX/lib"
          echo "PETSC_DIR=$PETSC_PREFIX" >> "$GITHUB_ENV"
          echo "PETSc prefix: $PETSC_PREFIX"

      - name: Configure distributed solver
        run: |
          cmake -S . -B build-mpi-petsc \
            -DCMAKE_BUILD_TYPE=Release \
            -DCBS3D_ENABLE_MPI=ON \
            -DCBS3D_ENABLE_PETSC=ON \
            -DCBS3D_ENABLE_OPENMP=ON \
            -DCBS3D_BUILD_TESTS=OFF \
            -DCBS3D_BUILD_SOURCE_VALIDATION=OFF

      - name: Build distributed solver
        run: cmake --build build-mpi-petsc --parallel 2

      - name: Verify executable
        run: test -x build-mpi-petsc/cbs3dpp_si

      - name: Compile two-rank topology regression
        run: |
          mpic++ -std=c++20 -O2 \
            -Wall -Wextra -Werror -pedantic \
            -DOMPI_SKIP_MPICXX=1 \
            -DMPICH_SKIP_MPICXX=1 \
            -DCBS3D_USE_MPI=1 \
            -Iinclude \
            tests/TurbulenceWallTopologyMPIVerification.cpp \
            src/turbulence/WallDistance.cpp \
            -o turbulence_wall_topology_mpi_verification

      - name: Run two-rank topology regression
        run: mpirun -np 2 ./turbulence_wall_topology_mpi_verification

      - name: Publish MPI topology status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=success
          if [ "$JOB_STATUS" != "success" ]; then state=failure; fi
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"topology/mpi-petsc\",\"description\":\"MPI/PETSc build + cross-rank topology\",\"target_url\":\"$target_url\"}"

  apply-wallmodel-mpi-rank-fix:
    name: Apply and verify MPI wall-model rank-local fix
    if: github.event.head_commit.message == 'Stage MPI wall-model fix through established audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/sa-mpi
          fetch-depth: 0

      - name: Install OpenMPI
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ openmpi-bin libopenmpi-dev

      - name: Patch local-only wall guards and Sunbird provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/turbulence/WallModelCoupling.cpp')
          text = source.read_text(encoding='utf-8')

          old_faces = '''                if (cache.faces.empty())
                {
                    throw std::runtime_error(
                        "WallModelCoupling - wall treatment requested but no fluid BC 530/532 faces were found");
                }

                cache.global_faces = audit_global_face_uniqueness(s, cache.faces);
'''
          new_faces = '''                // A distributed rank is not required to touch the physical wall.
                // Audit the communicator-wide surface first and reject only when
                // the GLOBAL mesh contains no model wall at all.
                cache.global_faces = audit_global_face_uniqueness(s, cache.faces);

                if (cache.global_faces <= 0)
                {
                    throw std::runtime_error(
                        "WallModelCoupling - wall treatment requested but no fluid BC 530/532 faces were found globally");
                }
'''

          old_nodes = '''                if (cache.wall_nodes.empty())
                {
                    throw std::runtime_error(
                        "WallModelCoupling - no model-wall nodes survived projector construction");
                }

                cache.ready = true;
'''
          new_nodes = '''                // Interior MPI ranks may legitimately own no wall nodes.  The
                // invariant is communicator-wide: at least one wall-node
                // projector must exist somewhere when global wall faces exist.
                long long global_wall_node_occurrences =
                    static_cast<long long>(cache.wall_nodes.size());

          #ifdef CBS3D_USE_MPI
                if (s.mpi_enabled && s.mpi_size > 1)
                {
                    const long long local_wall_node_occurrences =
                        global_wall_node_occurrences;
                    check_mpi(
                        MPI_Allreduce(
                            &local_wall_node_occurrences,
                            &global_wall_node_occurrences,
                            1,
                            MPI_LONG_LONG,
                            MPI_SUM,
                            MPI_COMM_WORLD),
                        "MPI_Allreduce wall-node projector audit");
                }
          #endif

                if (global_wall_node_occurrences <= 0)
                {
                    throw std::runtime_error(
                        "WallModelCoupling - no model-wall nodes survived global projector construction");
                }

                cache.ready = true;
'''

          if text.count(old_faces) != 1:
              raise SystemExit('Expected exactly one local wall-face rejection block')
          if text.count(old_nodes) != 1:
              raise SystemExit('Expected exactly one local wall-node rejection block')
          source.write_text(
              text.replace(old_faces, new_faces).replace(old_nodes, new_nodes),
              encoding='utf-8')

          slurm = Path('jobs/sunbird/flatplate_wallmodel_p40_startup.slurm')
          job = slurm.read_text(encoding='utf-8')
          old_git = '''printf 'git HEAD        = %s\\n' "$(git -C "$CODE" rev-parse HEAD)"
'''
          new_git = '''GIT_HEAD_FILE="$CODE/.git/refs/heads/integration/sa-mpi"
          if [[ -r "$GIT_HEAD_FILE" ]]; then
              GIT_HEAD=$(cat "$GIT_HEAD_FILE")
          else
              GIT_HEAD="unavailable-on-compute-node"
          fi
          printf 'git HEAD        = %s\\n' "$GIT_HEAD"
'''
          if job.count(old_git) != 1:
              raise SystemExit('Expected exactly one compute-node git provenance call')
          slurm.write_text(job.replace(old_git, new_git), encoding='utf-8')
          PY

      - name: Compile exact two-rank regression against patched source
        run: |
          mpic++ -std=c++20 -O2 \
            -Wall -Wextra -Werror -Wno-error=unused-function -pedantic \
            -DOMPI_SKIP_MPICXX=1 \
            -DMPICH_SKIP_MPICXX=1 \
            -DCBS3D_USE_MPI=1 \
            -Iinclude \
            tests/WallModelCouplingMPIRankLocalVerification.cpp \
            src/turbulence/WallModelCoupling.cpp \
            src/turbulence/WallTreatment.cpp \
            src/parallel/HaloExchange.cpp \
            -o wall_model_mpi_rank_local_verification

      - name: Run exact two-rank regression
        env:
          CBS3D_SA_WALL_TREATMENT: "1"
        run: mpirun -np 2 ./wall_model_mpi_rank_local_verification

      - name: Audit patch
        run: |
          git diff --check
          git diff -- src/turbulence/WallModelCoupling.cpp jobs/sunbird/flatplate_wallmodel_p40_startup.slurm

      - name: Commit verified fix to integration branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/turbulence/WallModelCoupling.cpp jobs/sunbird/flatplate_wallmodel_p40_startup.slurm
          git commit -m 'Fix MPI wall model on ranks without local wall faces'
          git push origin HEAD:integration/sa-mpi

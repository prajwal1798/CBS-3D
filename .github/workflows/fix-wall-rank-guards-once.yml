name: Exact MPI wall rank guard repair

on:
  push:
    branches:
      - integration/sa-mpi

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/sa-mpi
          fetch-depth: 0

      - name: Replace only the two invalid rank-local guards
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/turbulence/WallModelCoupling.cpp')
          text = path.read_text(encoding='utf-8')

          old_faces = '''                if (cache.faces.empty())
                {
                    throw std::runtime_error(
                        "WallModelCoupling - wall treatment requested but no fluid BC 530/532 faces were found");
                }

                cache.global_faces = audit_global_face_uniqueness(s, cache.faces);
'''
          new_faces = '''                // A distributed rank is not required to touch the physical wall.
                // All ranks must participate in the communicator-wide face audit;
                // reject the case only when the GLOBAL wall inventory is empty.
                cache.global_faces = audit_global_face_uniqueness(s, cache.faces);

                if (cache.global_faces <= 0)
                {
                    throw std::runtime_error(
                        "WallModelCoupling - wall treatment requested but no fluid BC 530/532 faces were found globally");
                }
'''

          old_nodes = '''                if (cache.wall_nodes.empty())
                {
                    throw std::runtime_error(
                        "WallModelCoupling - no model-wall nodes survived projector construction");
                }

                cache.ready = true;
'''
          new_nodes = '''                // Interior MPI ranks may legitimately have no local wall projector.
                // The required invariant is communicator-wide: at least one
                // wall-node projector exists somewhere when global wall faces exist.
                const long long local_wall_node_occurrences =
                    static_cast<long long>(cache.wall_nodes.size());
                long long global_wall_node_occurrences =
                    local_wall_node_occurrences;

#ifdef CBS3D_USE_MPI
                if (s.mpi_enabled && s.mpi_size > 1)
                {
                    check_mpi(
                        MPI_Allreduce(
                            &local_wall_node_occurrences,
                            &global_wall_node_occurrences,
                            1,
                            MPI_LONG_LONG,
                            MPI_SUM,
                            MPI_COMM_WORLD),
                        "MPI_Allreduce wall-node projector audit");
                }
#endif

                if (global_wall_node_occurrences <= 0)
                {
                    throw std::runtime_error(
                        "WallModelCoupling - no model-wall nodes survived global projector construction");
                }

                cache.ready = true;
'''

          if text.count(old_faces) != 1:
              raise SystemExit('expected exactly one old local wall-face guard')
          if text.count(old_nodes) != 1:
              raise SystemExit('expected exactly one old local wall-node guard')

          text = text.replace(old_faces, new_faces)
          text = text.replace(old_nodes, new_nodes)
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          grep -n 'cache.faces.empty\|cache.global_faces <= 0\|cache.wall_nodes.empty\|global_wall_node_occurrences' src/turbulence/WallModelCoupling.cpp

      - name: Commit repair and remove this one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-wall-rank-guards-once.yml
          git add src/turbulence/WallModelCoupling.cpp
          git diff --cached --check
          git commit -m 'Fix MPI wall model on ranks without local wall faces'
          git push origin HEAD:integration/sa-mpi

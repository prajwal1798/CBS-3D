name: One-shot SA Dirichlet residual cleanup

"on":
  push:
    branches:
      - integration/sa-mpi
    paths:
      - .github/workflows/sa-dirichlet-residual-cleanup-once.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/sa-mpi
          fetch-depth: 0

      - name: Zero SA convergence update on strong Dirichlet nodes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/boundary/TurbulenceBoundary.cpp')
          text = p.read_text(encoding='utf-8')

          wall_old = '''            if (s.sa_wall_node(ip) != 0)\n            {\n                s.nu_tilde(ip) = 0.0;\n                s.nu_tilde1(ip) = 0.0;\n                s.nu_t(ip) = 0.0;\n                s.mu_t(ip) = 0.0;\n            }\n'''
          wall_new = '''            if (s.sa_wall_node(ip) != 0)\n            {\n                s.nu_tilde(ip) = 0.0;\n                s.nu_tilde1(ip) = 0.0;\n                s.nu_t(ip) = 0.0;\n                s.mu_t(ip) = 0.0;\n\n                // This is a strong Dirichlet degree of freedom, not an SA\n                // transport unknown.  Any unconstrained update assembled before\n                // the boundary package must not contaminate the convergence norm.\n                s.sa_residual(ip) = 0.0;\n            }\n'''

          inlet_old = '''            if (s.sa_inlet_node(ip) != 0 && s.sa_wall_node(ip) == 0)\n            {\n                const Real nu = nodal_molecular_nu(s, ip, fluid_touch_count);\n                s.nu_tilde(ip) = std::max(0.0, s.cfg.sa_inlet_ratio * nu);\n                s.nu_tilde1(ip) = s.nu_tilde(ip);\n            }\n'''
          inlet_new = '''            if (s.sa_inlet_node(ip) != 0 && s.sa_wall_node(ip) == 0)\n            {\n                const Real nu = nodal_molecular_nu(s, ip, fluid_touch_count);\n                s.nu_tilde(ip) = std::max(0.0, s.cfg.sa_inlet_ratio * nu);\n                s.nu_tilde1(ip) = s.nu_tilde(ip);\n\n                // The inlet value is prescribed strongly.  The transport\n                // equation is not a convergence equation at this degree of\n                // freedom, so discard the provisional unconstrained update.\n                s.sa_residual(ip) = 0.0;\n            }\n'''

          if text.count(wall_old) != 1:
              raise SystemExit('FATAL: wall Dirichlet block did not match exactly once')
          if text.count(inlet_old) != 1:
              raise SystemExit('FATAL: inlet Dirichlet block did not match exactly once')
          text = text.replace(wall_old, wall_new).replace(inlet_old, inlet_new)
          p.write_text(text, encoding='utf-8')

          final = p.read_text(encoding='utf-8')
          if final.count('s.sa_residual(ip) = 0.0;') < 2:
              raise SystemExit('FATAL: expected Dirichlet residual resets are missing')
          print('PASS: strong SA wall/inlet nodes no longer pollute RelSA')
          PY

      - name: Check whitespace
        run: git diff --check

      - name: Run deterministic Liu element gate
        shell: bash
        run: |
          cmake -S tests/liu -B build/liu-dirichlet-gate -DCMAKE_BUILD_TYPE=Release
          cmake --build build/liu-dirichlet-gate --parallel 2
          ctest --test-dir build/liu-dirichlet-gate --output-on-failure

      - name: Compile serial production target
        shell: bash
        run: |
          cmake -S . -B build/sa-dirichlet-compile \
            -DCMAKE_BUILD_TYPE=Release \
            -DCBS3D_ENABLE_OPENMP=OFF \
            -DCBS3D_ENABLE_MPI=OFF \
            -DCBS3D_ENABLE_PETSC=OFF \
            -DCBS3D_KEEP_LEGACY_EXECUTABLE_NAME=OFF
          cmake --build build/sa-dirichlet-compile --parallel 2

      - name: Commit verified source correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/boundary/TurbulenceBoundary.cpp
          git diff --cached --check
          git commit -m "Exclude strong SA Dirichlet nodes from residual"
          git push origin HEAD:integration/sa-mpi

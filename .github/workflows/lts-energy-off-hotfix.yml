name: LTS energy-off diffusivity hotfix

on:
  push:
    branches:
      - integration/sa-mpi
    paths:
      - .github/workflows/lts-energy-off-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: integration/sa-mpi
          fetch-depth: 0

      - name: Patch TimeStep diffusivity selection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/timestep/TimeStep.cpp')
          text = path.read_text()

          start_marker = '''        Real element_diffusivity_for_timestep(\n            const CBSStateSI& s,\n            const Int ie)\n        {\n'''
          end_marker = '''\n\n\n        // Calculates the local element stability time step:\n'''

          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('element_diffusivity_for_timestep start marker not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('element_diffusivity_for_timestep end marker not found')

          replacement = r'''        Real element_diffusivity_for_timestep(
            const CBSStateSI& s,
            const Int ie)
        {
            Real diff = s.cfg.ani;

            if (s.cfg.dimensional_mode > 0 &&
                s.cfg.material_properties_enabled > 0)
            {
                const bool fluid_element = s.mat_elem(ie) == 0;

                if (!fluid_element)
                {
                    if (s.alpha_e(ie) <= 0.0 ||
                        !std::isfinite(s.alpha_e(ie)))
                    {
                        throw std::runtime_error(
                            "TimeStep - invalid thermal diffusivity alpha_e at element "
                            + std::to_string(ie));
                    }

                    diff = s.alpha_e(ie);
                }
                else
                {
                    if (s.rho_e(ie) <= 0.0 ||
                        !std::isfinite(s.rho_e(ie)) ||
                        s.mu_e(ie) < 0.0 ||
                        !std::isfinite(s.mu_e(ie)))
                    {
                        throw std::runtime_error(
                            "TimeStep - invalid fluid rho/mu at element "
                            + std::to_string(ie));
                    }

                    Real nu = s.mu_e(ie) / s.rho_e(ie);

                    if (s.cfg.turbulence_on > 0)
                    {
                        if (s.mu_eff_e(ie) < 0.0 ||
                            !std::isfinite(s.mu_eff_e(ie)))
                        {
                            throw std::runtime_error(
                                "TimeStep - invalid effective viscosity at element "
                                + std::to_string(ie));
                        }

                        nu = s.mu_eff_e(ie) / s.rho_e(ie);
                    }

                    diff = nu;

                    // Thermal diffusion is a stability restriction only when
                    // the energy equation is actually being advanced.
                    if (s.cfg.temp_calc > 0)
                    {
                        if (s.alpha_e(ie) <= 0.0 ||
                            !std::isfinite(s.alpha_e(ie)))
                        {
                            throw std::runtime_error(
                                "TimeStep - invalid thermal diffusivity alpha_e at element "
                                + std::to_string(ie));
                        }

                        diff = std::max(diff, s.alpha_e(ie));

                        if (s.cfg.turbulence_on > 0 &&
                            s.cfg.turbulent_thermal_diffusivity_on > 0)
                        {
                            if (s.k_eff_e(ie) <= 0.0 ||
                                !std::isfinite(s.k_eff_e(ie)) ||
                                s.rho_cp_e(ie) <= 0.0 ||
                                !std::isfinite(s.rho_cp_e(ie)))
                            {
                                throw std::runtime_error(
                                    "TimeStep - invalid effective thermal properties at element "
                                    + std::to_string(ie));
                            }

                            const Real alpha_eff =
                                s.k_eff_e(ie) / s.rho_cp_e(ie);

                            diff = std::max(diff, alpha_eff);
                        }
                    }

                    // SA remains active in an isothermal flow, so its own
                    // diffusion coefficient must always constrain the timestep.
                    if (s.cfg.turbulence_on > 0)
                    {
                        const turbulence::SpalartAllmarasConstants sa_constants;
                        const Real nu_tilde_e = s.nu_tilde_e(ie);

                        if (nu_tilde_e < 0.0 ||
                            !std::isfinite(nu_tilde_e))
                        {
                            throw std::runtime_error(
                                "TimeStep - invalid nu_tilde_e at element "
                                + std::to_string(ie));
                        }

                        const Real molecular_nu =
                            s.mu_e(ie) / s.rho_e(ie);

                        const Real sa_diffusivity =
                            (molecular_nu + nu_tilde_e) /
                            sa_constants.sigma;

                        diff = std::max(diff, sa_diffusivity);
                    }
                }
            }

            if (diff <= 0.0 || !std::isfinite(diff))
            {
                throw std::runtime_error(
                    "TimeStep - invalid timestep diffusivity at element "
                    + std::to_string(ie));
            }

            return diff;
        }'''

          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/timestep/TimeStep.cpp; then
            echo 'No source change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/timestep/TimeStep.cpp
          git commit -m 'Fix energy-off LTS thermal throttling'
          git push origin HEAD:integration/sa-mpi

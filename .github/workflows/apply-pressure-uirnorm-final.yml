name: Apply pressure initial-residual convergence fix

on:
  push:
    branches:
      - integration/sa-mpi

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: integration/sa-mpi
          fetch-depth: 0

      - name: Patch PETSc pressure convergence reference norm
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/linalg/PetscPersistentDistributedPressureSystem.cpp')
          text = p.read_text()

          old = '''        check_petsc(\n            KSPSetNormType(\n                impl_->ksp,\n                KSP_NORM_UNPRECONDITIONED),\n            "KSPSetNormType(KSP_NORM_UNPRECONDITIONED)");\n\n        check_petsc(\n            KSPSetUp(impl_->ksp),\n            "KSPSetUp(persistent pressure)");\n'''

          new = '''        check_petsc(\n            KSPSetNormType(\n                impl_->ksp,\n                KSP_NORM_UNPRECONDITIONED),\n            "KSPSetNormType(KSP_NORM_UNPRECONDITIONED)");\n\n        // The pressure solve reuses the previous pressure field as a nonzero\n        // initial guess.  Make PETSc's relative tolerance refer to the same\n        // initial true residual used by the CBS3D CGrel diagnostic:\n        //\n        //     ||b - A p_k|| / ||b - A p_0|| <= rtol.\n        //\n        // Without UIRNorm PETSc's default relative reference can be based on\n        // ||b|| instead, so a solve may stop while the independently recomputed\n        // CGrel remains far above the requested tolerance.\n        check_petsc(\n            KSPConvergedDefaultSetUIRNorm(impl_->ksp),\n            "KSPConvergedDefaultSetUIRNorm");\n\n        check_petsc(\n            KSPSetUp(impl_->ksp),\n            "KSPSetUp(persistent pressure)");\n'''

          if new in text:
              print('Pressure UIRNorm patch already present.')
          else:
              if text.count(old) != 1:
                  raise SystemExit('expected KSP norm/setup block exactly once')
              text = text.replace(old, new, 1)
              p.write_text(text)
              print('Applied pressure UIRNorm patch.')
          PY

      - name: Compile distributed MPI/PETSc target
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ openmpi-bin libopenmpi-dev \
            libpetsc-real-dev libhypre-dev
          cmake -S . -B build-ci-pressure-uir \
            -DCMAKE_BUILD_TYPE=Release \
            -DCBS3D_ENABLE_MPI=ON \
            -DCBS3D_ENABLE_PETSC=ON \
            -DCBS3D_ENABLE_OPENMP=ON \
            -DCBS3D_BUILD_TESTS=OFF \
            -DCBS3D_BUILD_SOURCE_VALIDATION=OFF
          cmake --build build-ci-pressure-uir -j 2

      - name: Commit source patch if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/linalg/PetscPersistentDistributedPressureSystem.cpp; then
            echo 'No source change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/linalg/PetscPersistentDistributedPressureSystem.cpp
          git commit -m 'Use initial true residual for PETSc pressure convergence'
          git push origin HEAD:integration/sa-mpi

name: Apply energy-off LTS source fix

on:
  push:
    branches:
      - integration/sa-mpi

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: integration/sa-mpi
          fetch-depth: 0

      - name: Apply exact Sunbird-validated TimeStep patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/timestep/TimeStep.cpp')
          text = p.read_text()

          old1 = """                        if (s.cfg.turbulent_thermal_diffusivity_on > 0)\n"""
          new1 = """                        if (s.cfg.temp_calc > 0 &&\n                            s.cfg.turbulent_thermal_diffusivity_on > 0)\n"""

          old2 = """                    diff = std::max(diff, nu);\n\n                    // Spalart-Allmaras diffusion limit.\n"""
          new2 = """                    // Thermal diffusion constrains the pseudo-time only\n                    // when the energy equation is actually being advanced.\n                    // For an isothermal fluid calculation, the active\n                    // restrictions are momentum and, when enabled, SA.\n                    if (s.cfg.temp_calc > 0)\n                    {\n                        diff = std::max(diff, nu);\n                    }\n                    else\n                    {\n                        diff = nu;\n                    }\n\n                    // Spalart-Allmaras diffusion limit.\n"""

          changed = False
          if old1 in text:
              if text.count(old1) != 1:
                  raise SystemExit('unexpected count for thermal-turbulence condition')
              text = text.replace(old1, new1, 1)
              changed = True
          elif new1 not in text:
              raise SystemExit('neither old nor patched thermal condition found')

          if old2 in text:
              if text.count(old2) != 1:
                  raise SystemExit('unexpected count for fluid diffusivity update')
              text = text.replace(old2, new2, 1)
              changed = True
          elif new2 not in text:
              raise SystemExit('neither old nor patched diffusivity block found')

          if changed:
              p.write_text(text)
              print('Applied exact Sunbird-validated energy-off LTS patch.')
          else:
              print('Source already patched; no change required.')
          PY

      - name: Commit source patch if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/timestep/TimeStep.cpp; then
            echo 'No source change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/timestep/TimeStep.cpp
          git commit -m 'Fix energy-off LTS thermal throttling'
          git push origin HEAD:integration/sa-mpi

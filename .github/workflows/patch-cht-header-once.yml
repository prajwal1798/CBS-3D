name: Patch CHT header once

on:
  push:
    branches: [integration/sa-mpi]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Patch CHT header compile guards'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/sa-mpi
          fetch-depth: 0

      - name: Apply compile fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('include/cbs/turbulence/CHTWallModelCoupling.hpp')
          s = p.read_text()

          old = '''            struct Cache
            {
                const CBSStateSI* state = nullptr;
                Int npoin = 0;
                Int nelem = 0;
                bool ready = false;
                long long global_faces = 0;
                std::vector<ModelFace> faces;
                std::vector<Int> wall_nodes;
                std::vector<std::array<Real, 9>> normal_projector;
                std::vector<Real> bulk_conductivity;
            };
'''
          new = '''            struct Cache
            {
                const CBSStateSI* state;
                Int npoin;
                Int nelem;
                bool ready;
                long long global_faces;
                std::vector<ModelFace> faces;
                std::vector<Int> wall_nodes;
                std::vector<std::array<Real, 9>> normal_projector;
                std::vector<Real> bulk_conductivity;

                Cache()
                    : state(nullptr),
                      npoin(0),
                      nelem(0),
                      ready(false),
                      global_faces(0)
                {
                }
            };
'''
          if s.count(old) != 1:
              raise SystemExit('Cache block mismatch')
          s = s.replace(old, new)

          needle = '''            static void collectLocalFaces(
                const CBSStateSI& s,
                std::vector<ModelFace>& accepted,
                std::vector<CandidateFace>& partition_candidates)
            {
                std::vector<CandidateFace> candidates;
'''
          replacement = '''            static void collectLocalFaces(
                const CBSStateSI& s,
                std::vector<ModelFace>& accepted,
                std::vector<CandidateFace>& partition_candidates)
            {
#ifndef CBS3D_USE_MPI
                (void)partition_candidates;
#endif
                std::vector<CandidateFace> candidates;
'''
          if s.count(needle) != 1:
              raise SystemExit('collectLocalFaces block mismatch')
          s = s.replace(needle, replacement)
          p.write_text(s)
          PY

          git diff --check
          git diff -- include/cbs/turbulence/CHTWallModelCoupling.hpp

      - name: Commit verified textual fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include/cbs/turbulence/CHTWallModelCoupling.hpp
          git commit -m 'Fix CHT wall header compile guards'
          git push origin HEAD:integration/sa-mpi

name: One-shot Liu source warning cleanup

"on":
  push:
    branches:
      - integration/sa-mpi
    paths:
      - .github/workflows/cleanup-liu-warning-source-once.yml

permissions:
  contents: write

jobs:
  patch-source:
    name: Patch and verify Liu source
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: integration/sa-mpi
          fetch-depth: 0

      - name: Guard disabled OpenMP and remove dead code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          momentum = Path("src/assembly/MomentumAssemblyLiu.cpp")
          sa = Path("src/assembly/SpalartAllmarasAssemblyLiu.cpp")

          def guard_pragmas(path):
              text = path.read_text(encoding="utf-8")
              pragmas = [
                  "#pragma omp parallel for schedule(static)",
                  "#pragma omp atomic write",
                  "#pragma omp critical(sa_liu_ceiling)",
                  "#pragma omp critical(sa_liu_update_failure)",
              ]
              total = 0
              for pragma in pragmas:
                  count = text.count(pragma)
                  if count:
                      guarded = "#ifdef CBS3D_USE_OPENMP\n" + pragma + "\n#endif"
                      text = text.replace(pragma, guarded)
                      total += count
              if total == 0:
                  raise SystemExit("FATAL: no Liu OpenMP pragmas found in " + str(path))
              path.write_text(text, encoding="utf-8")
              return total

          nm = guard_pragmas(momentum)
          ns = guard_pragmas(sa)

          text = sa.read_text(encoding="utf-8")
          start_marker = "        Real element_wall_distance(\n"
          end_marker = "        Real vorticity_magnitude("
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit("FATAL: could not uniquely locate unused element_wall_distance helper")
          text = text[:start] + text[end:]

          dead_chi = (
              "                const Real chi_value =\n"
              "                    turbulence::chi(q_average, molecular_nu);\n"
          )
          if text.count(dead_chi) != 1:
              raise SystemExit("FATAL: expected exactly one unused chi_value declaration")
          text = text.replace(dead_chi, "")
          sa.write_text(text, encoding="utf-8")

          for path in (momentum, sa):
              lines = path.read_text(encoding="utf-8").splitlines()
              for i, line in enumerate(lines):
                  if line.strip().startswith("#pragma omp"):
                      if i == 0 or lines[i - 1].strip() != "#ifdef CBS3D_USE_OPENMP":
                          raise SystemExit(
                              "FATAL: unguarded OpenMP pragma at " + str(path) + ":" + str(i + 1)
                          )

          final_sa = sa.read_text(encoding="utf-8")
          if "element_wall_distance(" in final_sa:
              raise SystemExit("FATAL: unused element_wall_distance remains")
          if "const Real chi_value" in final_sa:
              raise SystemExit("FATAL: unused chi_value remains")

          print("PASS: guarded", nm, "momentum and", ns, "SA OpenMP pragmas")
          print("PASS: removed both genuinely unused SA declarations")
          PY

      - name: Check patch whitespace
        run: git diff --check

      - name: Build and run deterministic Liu gate
        shell: bash
        run: |
          cmake -S tests/liu -B build/liu-warning-clean -DCMAKE_BUILD_TYPE=Release
          cmake --build build/liu-warning-clean --parallel 2
          ctest --test-dir build/liu-warning-clean --output-on-failure

      - name: Verify pure-MPI-style compilation has no Liu warnings
        shell: bash
        run: |
          rm -rf build/liu-warning-compile
          cmake -S . -B build/liu-warning-compile \
            -DCMAKE_BUILD_TYPE=Release \
            -DCBS3D_ENABLE_OPENMP=OFF \
            -DCBS3D_ENABLE_MPI=OFF \
            -DCBS3D_ENABLE_PETSC=OFF \
            -DCBS3D_KEEP_LEGACY_EXECUTABLE_NAME=OFF \
            2>&1 | tee /tmp/configure.log
          cmake --build build/liu-warning-compile --parallel 2 2>&1 | tee /tmp/build.log
          if grep -E "MomentumAssemblyLiu.cpp|SpalartAllmarasAssemblyLiu.cpp" /tmp/build.log | grep -E "warning:|warning C"; then
            echo "FATAL: Liu source still emits compiler warnings" >&2
            exit 1
          fi

      - name: Commit verified cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assembly/MomentumAssemblyLiu.cpp src/assembly/SpalartAllmarasAssemblyLiu.cpp
          git diff --cached --check
          git commit -m "Guard Liu OpenMP pragmas and remove dead warnings"
          git push origin HEAD:integration/sa-mpi

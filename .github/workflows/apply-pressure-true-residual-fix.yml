name: Apply pressure true-residual convergence fix

on:
  push:
    branches:
      - integration/sa-mpi

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: integration/sa-mpi
          fetch-depth: 0

      - name: Patch PETSc pressure convergence norm
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/linalg/PetscPersistentDistributedPressureSystem.cpp')
          text = p.read_text()

          old1 = '''        check_petsc(\n            KSPSetFromOptions(impl_->ksp),\n            "KSPSetFromOptions");\n\n        check_petsc(\n            KSPSetUp(impl_->ksp),\n            "KSPSetUp(persistent pressure)");\n'''
          new1 = '''        check_petsc(\n            KSPSetFromOptions(impl_->ksp),\n            "KSPSetFromOptions");\n\n        // Convergence must be measured in the physical (unpreconditioned)\n        // pressure residual.  With AMG the preconditioned norm can become tiny\n        // even while ||b-Ap||/||r0|| is still O(1e-1), which previously let\n        // late steady iterations terminate after only a few CG steps.\n        check_petsc(\n            KSPSetNormType(\n                impl_->ksp,\n                KSP_NORM_UNPRECONDITIONED),\n            "KSPSetNormType(KSP_NORM_UNPRECONDITIONED)");\n\n        check_petsc(\n            KSPSetUp(impl_->ksp),\n            "KSPSetUp(persistent pressure)");\n'''

          old2 = '''            result.final_max_abs =\n                vector_max_norm(impl_->residual);\n\n            result.converged = reason > 0;\n'''
          new2 = '''            result.final_max_abs =\n                vector_max_norm(impl_->residual);\n\n            // PETSc's reason must agree with the explicitly recomputed true\n            // residual.  This prevents a preconditioner-dependent convergence\n            // decision from being accepted as a pressure solve.\n            const Real true_residual_target =\n                std::max(\n                    std::max(0.0, s.cfg.absToler),\n                    std::max(0.0, s.cfg.relToler) * scaled_initial_l2);\n\n            result.converged =\n                reason > 0 &&\n                scaled_final_l2 <= true_residual_target;\n'''

          changed = False

          if old1 in text:
              if text.count(old1) != 1:
                  raise SystemExit('unexpected count for KSPSetFromOptions/KSPSetUp block')
              text = text.replace(old1, new1, 1)
              changed = True
          elif new1 not in text:
              raise SystemExit('neither original nor patched KSP norm block found')

          if old2 in text:
              if text.count(old2) != 1:
                  raise SystemExit('unexpected count for pressure convergence assignment')
              text = text.replace(old2, new2, 1)
              changed = True
          elif new2 not in text:
              raise SystemExit('neither original nor patched true-residual block found')

          if changed:
              p.write_text(text)
              print('Applied pressure true-residual convergence patch.')
          else:
              print('Pressure true-residual patch already present.')
          PY

      - name: Commit source patch if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/linalg/PetscPersistentDistributedPressureSystem.cpp; then
            echo 'No source change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/linalg/PetscPersistentDistributedPressureSystem.cpp
          git commit -m 'Enforce true-residual PETSc pressure convergence'
          git push origin HEAD:integration/sa-mpi
